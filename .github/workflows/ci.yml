name: ci

on: push

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: ⎔ Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 📥 Download deps
        run: bun ci

      - name: 🧪 Run test script
        run: bun run test
